<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/>
    </marker>
  </defs>
  <rect width="1080" height="560" fill="#ffffff"/>

  <!-- local -->
  <rect x="20" y="20" width="580" height="520" rx="16" fill="#fbfaff" stroke="#6b5bd2" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="310" y="56" text-anchor="middle" font-size="20" font-weight="bold" fill="#1d1d1f">Your notebook kernel</text>
  <text x="310" y="80" text-anchor="middle" font-size="15" fill="#555">agent, gateway and training loop run here</text>

  <rect x="50" y="110" width="210" height="170" rx="10" fill="#eeeafc" stroke="#9a8fe3"/>
  <text x="155" y="148" text-anchor="middle" font-size="17" font-weight="bold" fill="#3f2fa6">Strands agent</text>
  <text x="155" y="178" text-anchor="middle" font-size="14" fill="#3f2fa6">your tools</text>
  <text x="155" y="202" text-anchor="middle" font-size="13" font-family="Menlo, monospace" fill="#3f2fa6">run_agent(task, cfg)</text>
  <text x="155" y="232" text-anchor="middle" font-size="14" fill="#3f2fa6">reward from the</text>
  <text x="155" y="252" text-anchor="middle" font-size="14" fill="#3f2fa6">agent's tool calls</text>

  <rect x="360" y="110" width="210" height="170" rx="10" fill="#eeeafc" stroke="#9a8fe3"/>
  <text x="465" y="148" text-anchor="middle" font-size="17" font-weight="bold" fill="#3f2fa6">Rollout gateway</text>
  <text x="465" y="174" text-anchor="middle" font-size="13" font-style="italic" fill="#3f2fa6">AgentCore RL Toolkit</text>
  <text x="465" y="202" text-anchor="middle" font-size="14" fill="#3f2fa6">127.0.0.1, OpenAI chat API</text>
  <text x="465" y="232" text-anchor="middle" font-size="14" fill="#3f2fa6">chat template,</text>
  <text x="465" y="252" text-anchor="middle" font-size="14" fill="#3f2fa6">tool-call parsing</text>

  <rect x="50" y="360" width="520" height="140" rx="10" fill="#eeeafc" stroke="#9a8fe3"/>
  <text x="310" y="398" text-anchor="middle" font-size="17" font-weight="bold" fill="#3f2fa6">GRPO step (your code)</text>
  <text x="310" y="430" text-anchor="middle" font-size="14" fill="#3f2fa6">8 attempts per request: advantage = (reward − mean) / std</text>
  <text x="310" y="456" text-anchor="middle" font-size="14" fill="#3f2fa6">one training datum per attempt</text>
  <text x="310" y="482" text-anchor="middle" font-size="14" fill="#3f2fa6">skip groups where all attempts scored the same</text>

  <!-- remote -->
  <rect x="760" y="20" width="300" height="520" rx="16" fill="#fafdfb" stroke="#2e7d55" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="910" y="56" text-anchor="middle" font-size="20" font-weight="bold" fill="#1d1d1f">Training session</text>
  <text x="910" y="80" text-anchor="middle" font-size="15" fill="#555">on SageMaker AI</text>

  <rect x="790" y="110" width="240" height="390" rx="10" fill="#e3f4ea" stroke="#7fc29b"/>
  <text x="910" y="148" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e6b45">Managed GPUs</text>
  <text x="910" y="176" text-anchor="middle" font-size="14" fill="#1e6b45">gpt-oss-20b or</text>
  <text x="910" y="196" text-anchor="middle" font-size="14" fill="#1e6b45">Qwen3.8-27B + LoRA</text>
  <text x="910" y="250" text-anchor="middle" font-size="14" fill="#1e6b45">generates tokens</text>
  <text x="910" y="276" text-anchor="middle" font-size="14" fill="#1e6b45">computes gradients</text>
  <text x="910" y="302" text-anchor="middle" font-size="14" fill="#1e6b45">updates the adapter</text>
  <text x="910" y="328" text-anchor="middle" font-size="14" fill="#1e6b45">snapshots new weights</text>
  <text x="910" y="380" text-anchor="middle" font-size="14" fill="#1e6b45">model stays loaded</text>
  <text x="910" y="402" text-anchor="middle" font-size="14" fill="#1e6b45">between calls</text>

  <!-- agent <-> gateway -->
  <line x1="262" y1="175" x2="356" y2="175" stroke="#8a8a8a" stroke-width="2" marker-end="url(#a)"/>
  <text x="310" y="164" text-anchor="middle" font-size="13" fill="#444">chat request</text>
  <line x1="358" y1="215" x2="264" y2="215" stroke="#8a8a8a" stroke-width="2" marker-end="url(#a)"/>
  <text x="310" y="236" text-anchor="middle" font-size="13" fill="#444">text / tool call</text>

  <!-- gateway <-> session -->
  <line x1="572" y1="175" x2="786" y2="175" stroke="#8a8a8a" stroke-width="2" marker-end="url(#a)"/>
  <text x="680" y="164" text-anchor="middle" font-size="13" font-family="Menlo, monospace" fill="#444">sample()</text>
  <line x1="786" y1="215" x2="574" y2="215" stroke="#8a8a8a" stroke-width="2" marker-end="url(#a)"/>
  <text x="680" y="236" text-anchor="middle" font-size="13" fill="#444">tokens, logprobs</text>

  <!-- down to GRPO -->
  <line x1="155" y1="282" x2="155" y2="356" stroke="#8a8a8a" stroke-width="2" marker-end="url(#a)"/>
  <text x="165" y="324" font-size="13" fill="#444">reward</text>
  <line x1="465" y1="282" x2="465" y2="356" stroke="#8a8a8a" stroke-width="2" marker-end="url(#a)"/>
  <text x="475" y="316" font-size="13" fill="#444">token records</text>
  <text x="475" y="333" font-size="13" fill="#444">per model call</text>

  <!-- GRPO -> session -->
  <line x1="572" y1="415" x2="786" y2="415" stroke="#8a8a8a" stroke-width="2" marker-end="url(#a)"/>
  <text x="680" y="388" text-anchor="middle" font-size="12" font-family="Menlo, monospace" fill="#444">forward_backward</text>
  <text x="680" y="404" text-anchor="middle" font-size="12" font-family="Menlo, monospace" fill="#444">optim_step</text>
  <line x1="572" y1="470" x2="786" y2="470" stroke="#8a8a8a" stroke-width="2" marker-end="url(#a)"/>
  <text x="680" y="459" text-anchor="middle" font-size="13" fill="#444">refresh sampler</text>
</svg>
