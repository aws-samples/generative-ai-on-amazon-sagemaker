<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1080" height="684" viewBox="0 0 1080 684" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/>
    </marker>
  </defs>
  <rect width="1080" height="684" fill="#ffffff"/>
  <text x="540" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1d1d1f">One attempt in code RL (single turn)</text>
  <text x="540" y="54" text-anchor="middle" font-size="13" font-style="italic" fill="#555">Simplified example; DeepCoder problems are longer and have more tests</text>

  <!-- lane headers -->
  <text x="140" y="88" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d1d1f">Problem</text>
  <text x="420" y="88" text-anchor="middle" font-size="16" font-weight="bold" fill="#3f2fa6">Model (Qwen3.8-27B)</text>
  <text x="730" y="88" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e6b45">Sandbox (Code Interpreter)</text>
  <text x="970" y="88" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a5a00">Reward</text>

  <!-- problem -->
  <rect x="20" y="102" width="240" height="220" rx="10" fill="#f5f5f7" stroke="#b8b8bd"/>
  <text x="34" y="126" font-size="13" fill="#1d1d1f">Read n, then n integers.</text>
  <text x="34" y="146" font-size="13" fill="#1d1d1f">Print the sum of the even ones.</text>
  <text x="34" y="176" font-size="12" font-weight="bold" fill="#1d1d1f">Tests (input → expected output)</text>
  <text x="34" y="198" font-size="12" font-family="Menlo, monospace" fill="#1d1d1f">3 / 1 2 4      → 6</text>
  <text x="34" y="218" font-size="12" font-family="Menlo, monospace" fill="#1d1d1f">4 / 5 7 9 11   → 0</text>
  <text x="34" y="238" font-size="12" font-family="Menlo, monospace" fill="#1d1d1f">1 / 10         → 10</text>
  <text x="34" y="270" font-size="12" font-style="italic" fill="#555">The model sees the problem text,</text>
  <text x="34" y="286" font-size="12" font-style="italic" fill="#555">not the tests.</text>
  <line x1="262" y1="160" x2="296" y2="160" stroke="#8a8a8a" stroke-width="2" marker-end="url(#a)"/>

  <!-- response -->
  <rect x="300" y="102" width="240" height="220" rx="10" fill="#eeeafc" stroke="#9a8fe3"/>
  <text x="314" y="126" font-size="12" font-weight="bold" fill="#6b5bd2">reasoning</text>
  <text x="314" y="144" font-size="12" fill="#3f2fa6">"Keep the numbers divisible</text>
  <text x="314" y="160" font-size="12" fill="#3f2fa6">by 2 and add them ..."</text>
  <text x="314" y="186" font-size="12" font-weight="bold" fill="#6b5bd2">generated code block</text>
  <text x="314" y="204" font-size="11" font-family="Menlo, monospace" fill="#3f2fa6">```python</text>
  <text x="314" y="220" font-size="11" font-family="Menlo, monospace" fill="#3f2fa6">n = int(input())</text>
  <text x="314" y="236" font-size="11" font-family="Menlo, monospace" fill="#3f2fa6">a = map(int, input().split())</text>
  <text x="314" y="252" font-size="11" font-family="Menlo, monospace" fill="#3f2fa6">print(sum(x for x in a</text>
  <text x="314" y="268" font-size="11" font-family="Menlo, monospace" fill="#3f2fa6">          if x % 2 == 0))</text>
  <text x="314" y="284" font-size="11" font-family="Menlo, monospace" fill="#3f2fa6">```</text>
  <text x="314" y="306" font-size="12" font-style="italic" fill="#555">up to 12,288 tokens in total</text>
  <line x1="542" y1="200" x2="596" y2="200" stroke="#8a8a8a" stroke-width="2" marker-end="url(#a)"/>

  <!-- sandbox -->
  <rect x="600" y="102" width="260" height="220" rx="10" fill="#e3f4ea" stroke="#7fc29b"/>
  <text x="614" y="126" font-size="12" fill="#1e6b45">1. take the last code block</text>
  <text x="614" y="146" font-size="12" fill="#1e6b45">2. run it on each test, 6 s limit</text>
  <text x="614" y="166" font-size="12" fill="#1e6b45">    (no network, no AWS credentials)</text>
  <text x="614" y="198" font-size="12" font-family="Menlo, monospace" fill="#1e6b45">test 1   6  ✓</text>
  <text x="614" y="218" font-size="12" font-family="Menlo, monospace" fill="#1e6b45">test 2   0  ✓</text>
  <text x="614" y="238" font-size="12" font-family="Menlo, monospace" fill="#1e6b45">test 3  10  ✓</text>
  <text x="614" y="270" font-size="12" font-weight="bold" fill="#1e6b45">all 3 tests pass</text>
  <line x1="862" y1="200" x2="896" y2="200" stroke="#8a8a8a" stroke-width="2" marker-end="url(#a)"/>

  <!-- reward -->
  <rect x="900" y="150" width="160" height="100" rx="10" fill="#fff6e5" stroke="#e0a83c"/>
  <text x="980" y="194" text-anchor="middle" font-size="26" font-weight="bold" fill="#8a5a00">1.0</text>
  <text x="980" y="222" text-anchor="middle" font-size="12" fill="#8a5a00">all tests pass</text>

  <!-- other attempts -->
  <text x="20" y="366" font-size="16" font-weight="bold" fill="#1d1d1f">Other attempts at the same problem (same group of 8)</text>

  <rect x="300" y="384" width="240" height="70" rx="10" fill="#eeeafc" stroke="#9a8fe3"/>
  <text x="314" y="408" font-size="12" fill="#3f2fa6">code with a bug:</text>
  <text x="314" y="430" font-size="11" font-family="Menlo, monospace" fill="#3f2fa6">... if x % 2 == 1))</text>
  <line x1="542" y1="419" x2="596" y2="419" stroke="#8a8a8a" stroke-width="2" marker-end="url(#a)"/>
  <rect x="600" y="384" width="260" height="70" rx="10" fill="#e3f4ea" stroke="#7fc29b"/>
  <text x="614" y="408" font-size="12" font-family="Menlo, monospace" fill="#b3261e">test 1   1  ✗ (expected 6)</text>
  <text x="614" y="430" font-size="12" fill="#1e6b45">a test fails</text>
  <line x1="862" y1="419" x2="896" y2="419" stroke="#8a8a8a" stroke-width="2" marker-end="url(#a)"/>
  <rect x="900" y="384" width="160" height="70" rx="10" fill="#fff6e5" stroke="#e0a83c"/>
  <text x="980" y="422" text-anchor="middle" font-size="22" font-weight="bold" fill="#8a5a00">0.0</text>

  <rect x="300" y="474" width="240" height="70" rx="10" fill="#eeeafc" stroke="#9a8fe3"/>
  <text x="314" y="498" font-size="12" fill="#3f2fa6">reasoning reaches the 12,288-</text>
  <text x="314" y="518" font-size="12" fill="#3f2fa6">token limit before any code</text>
  <line x1="542" y1="509" x2="596" y2="509" stroke="#8a8a8a" stroke-width="2" marker-end="url(#a)"/>
  <rect x="600" y="474" width="260" height="70" rx="10" fill="#f5f5f7" stroke="#b8b8bd"/>
  <text x="614" y="498" font-size="12" fill="#555">no code block,</text>
  <text x="614" y="518" font-size="12" fill="#555">nothing is sent to the sandbox</text>
  <line x1="862" y1="509" x2="896" y2="509" stroke="#8a8a8a" stroke-width="2" marker-end="url(#a)"/>
  <rect x="900" y="474" width="160" height="70" rx="10" fill="#fff6e5" stroke="#e0a83c"/>
  <text x="980" y="506" text-anchor="middle" font-size="22" font-weight="bold" fill="#8a5a00">−0.1</text>
  <text x="980" y="528" text-anchor="middle" font-size="12" fill="#8a5a00">no code block</text>

  <rect x="20" y="384" width="240" height="160" rx="10" fill="#f5f5f7" stroke="#b8b8bd"/>
  <text x="34" y="410" font-size="13" fill="#1d1d1f">GRPO compares the 8 rewards</text>
  <text x="34" y="430" font-size="13" fill="#1d1d1f">of one problem. Attempts above</text>
  <text x="34" y="450" font-size="13" fill="#1d1d1f">the group mean get a positive</text>
  <text x="34" y="470" font-size="13" fill="#1d1d1f">advantage and become more likely.</text>
  <text x="34" y="502" font-size="13" fill="#1d1d1f">If all 8 get the same reward,</text>
  <text x="34" y="522" font-size="13" fill="#1d1d1f">the group is skipped.</text>

  <!-- footer -->
  <text x="540" y="596" text-anchor="middle" font-size="14" fill="#444">Each attempt is one token sequence (prompt and response) and one training datum with its advantage.</text>
  <text x="540" y="618" text-anchor="middle" font-size="14" fill="#444">The base model passes about 12% of the held-out problems; many of its responses end before they contain code.</text>
</svg>
